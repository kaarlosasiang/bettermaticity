name: Format Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Explain failure
        if: failure()
        run: |
          echo "::error::Prettier found unformatted files. Run 'npm run format' locally and commit the result."
          echo "Deliberate exclusions belong in .prettierignore, not in an unformatted commit."
