<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123c7a" />
    <meta name="robots" content="noindex" />
    <title>Something Went Wrong — BetterMati.org</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/logo/favicon.svg" />
    <style>
      /* Self-contained (served by Apache outside the React app), styled to match the
         site: square corners, navy and royal blue, hairline borders. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          'Inter Variable',
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: #ffffff;
        color: #1a1a1a;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .bar {
        background: #123c7a;
        height: 6px;
      }
      header {
        border-bottom: 1px solid #dcdee2;
        padding: 1rem;
      }
      .wrap {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
      }
      .logo {
        display: block;
        height: 40px;
        width: auto;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        padding: 3rem 1rem 4rem;
      }
      .eyebrow {
        font-family: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.6875rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #2b62ee;
      }
      h1 {
        margin-top: 0.75rem;
        font-size: clamp(2.25rem, 6vw, 3rem);
        line-height: 1.1;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #111111;
      }
      .lede {
        margin-top: 1.25rem;
        max-width: 36rem;
        font-size: 1.0625rem;
        line-height: 1.7;
        color: #495057;
      }
      .actions {
        margin-top: 2rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        height: 2.75rem;
        padding: 0 1.25rem;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid #2b62ee;
      }
      .btn-primary {
        background: #2b62ee;
        color: #ffffff;
      }
      .btn-primary:hover {
        background: #123c7a;
        border-color: #123c7a;
      }
      .btn-secondary {
        background: #ffffff;
        color: #2b62ee;
        border-color: #dcdee2;
      }
      .btn-secondary:hover {
        border-color: #2b62ee;
      }
      .btn:focus-visible {
        outline: 2px solid #2b62ee;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="bar" aria-hidden="true"></div>
    <header>
      <div class="wrap">
        <a href="/" aria-label="BetterMati.org home">
          <img
            class="logo"
            src="/assets/images/logo/better-mati-logo.png"
            alt="BetterMati.org"
            width="128"
            height="40"
          />
        </a>
      </div>
    </header>
    <main id="main-content">
      <div class="wrap">
        <p class="eyebrow">Error 500</p>
        <h1>Something Went Wrong</h1>
        <p class="lede">
          The server ran into a problem and could not show this page. Please try again in a few
          minutes.
        </p>
        <div class="actions">
          <a href="/" class="btn btn-primary">Back to Home</a>
          <a href="/sitemap" class="btn btn-secondary">Site index</a>
        </div>
      </div>
    </main>
  </body>
</html>
