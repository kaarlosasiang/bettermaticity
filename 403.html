<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0032a0" />
    <title>Access Forbidden — BetterMati.org</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/logo/favicon.svg" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f7f5;
        color: #1a1a1a;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        text-align: center;
      }
      .container {
        max-width: 560px;
        width: 100%;
      }
      .logo {
        width: 180px;
        height: auto;
        margin-bottom: 2rem;
      }
      .code {
        font-size: 5rem;
        font-weight: 800;
        line-height: 1;
        color: #0032a0;
        letter-spacing: -0.02em;
      }
      h1 {
        font-size: 1.5rem;
        color: #0032a0;
        margin: 0.75rem 0 0.5rem;
      }
      .subtitle {
        color: #555;
        margin-bottom: 2rem;
        line-height: 1.6;
      }
      .home-btn {
        display: inline-block;
        background: #0032a0;
        color: #fff;
        border: none;
        padding: 0.75rem 2rem;
        font-size: 1rem;
        border-radius: 6px;
        cursor: pointer;
        text-decoration: none;
        font-weight: 600;
      }
      .home-btn:hover {
        background: #002170;
      }
      .home-btn:focus {
        outline: 2px solid #0032a0;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="container" role="main">
      <svg class="logo" viewBox="0 0 200 60" aria-label="BetterMati" role="img">
        <rect width="200" height="60" rx="8" fill="#0032a0" />
        <text
          x="100"
          y="36"
          text-anchor="middle"
          fill="#ffffff"
          font-family="Inter, sans-serif"
          font-size="18"
          font-weight="700"
        >
          BetterMati
        </text>
      </svg>
      <div class="code">403</div>
      <h1>Access Forbidden</h1>
      <p class="subtitle">
        You don't have permission to access this page. If you believe this is an error, please
        contact us.
      </p>
      <a href="/" class="home-btn">Back to Home</a>
    </main>
  </body>
</html>
